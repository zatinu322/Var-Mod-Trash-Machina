fail_fast: true
repos:
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: uv run ec ./src
        language: system
        stages: [pre-commit]

      - id: linters-ruff
        name: ruff
        entry: uv run ruff check ./src
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: linters-mypy
        name: mypy
        entry: uv run --with pydantic mypy ./src
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: test
        name: pytest
        entry: uv run pytest -vv
        language: system
        pass_filenames: false
        stages: [pre-commit]
