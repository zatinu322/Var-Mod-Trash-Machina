[project]
name = "ex-machina-randomizer"
version = "2.0.0"
description = "Various modification for Ex Machina game."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flet>=1.1.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "editorconfig-checker>=3.11.1",
    "icecream>=2.1.8",
    "mypy>=2.4.1",
    "nuitka>=4.3.5",
    "pre-commit>=4.7.0",
    "pytest>=9.0.2",
    "ruff>=0.17.6",
]

[tool.mypy]
ignore_missing_imports = true  # Workaround to avoid installation of all django project dependencies in a linter docker image
disallow_untyped_defs = true  # Disallows defining functions without type annotations or with incomplete type annotations
python_version = 3.12
plugins = [
  "pydantic.mypy",
]
